# Initial HTTP-only reverse proxy for HANA Eats -> pm2 app on 127.0.0.1:3016
# Install to: /etc/nginx/sites-available/eatsapp.hanaplatform.com
# Enable with: ln -s /etc/nginx/sites-available/eatsapp.hanaplatform.com /etc/nginx/sites-enabled/
#
# Run ssl-setup.sh AFTER this is enabled and nginx reloaded — certbot's
# --nginx plugin will obtain the cert and rewrite this file in place to add
# the HTTPS server block + HTTP->HTTPS redirect. Do not hand-add ssl_certificate
# lines here first; the cert files won't exist yet and nginx -t will fail.

server {
    listen 80;
    listen [::]:80;
    server_name eatsapp.hanaplatform.com;

    location / {
        proxy_pass http://127.0.0.1:3016;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
